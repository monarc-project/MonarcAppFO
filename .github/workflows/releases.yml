name: MonarcAppFO releases

# Publish images only after a GitHub release is published.
on:
  release:
    types: [published]

concurrency:
  group: ghcr-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ "16.x" ]
        php-version: [ "8.4" ]

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}

    - name: install deps
      run: sudo apt-get update && sudo apt install -y gettext

    # PHP
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      env:
        update: "true"
      with:
        php-version: ${{ matrix.php-version }}
        tools: composer:v2
        extensions: bcmath

    # javascript
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Assemble locked backend and frontend releases
      run: bash scripts/prepare-release.sh

    # prepare release
    - name: Get repository name
      id: repository
      run: |
        repo_name="${GITHUB_REPOSITORY#*/}"
        safe_ref=$(printf '%s' "$GITHUB_REF_NAME" | sed 's/[^[:alnum:].-]/_/g')
        echo "pathref=${repo_name}-${safe_ref}" >> "$GITHUB_OUTPUT"

    - name: create artifact archive
      run: |
        tar --exclude .git --exclude .github -zcf '../${{ steps.repository.outputs.pathref }}.tar.gz' .

    - name: Upload archive to the published release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        gh release upload "$RELEASE_TAG" '../${{ steps.repository.outputs.pathref }}.tar.gz' --clobber --repo "$GITHUB_REPOSITORY"

    - name: Set image names
      id: image_names
      run: |
        owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
        repo=$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')
        echo "app=ghcr.io/${owner}/${repo}" >> "$GITHUB_OUTPUT"
        echo "stats=ghcr.io/${owner}/${repo}-stats" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Docker metadata (app)
      id: meta_app
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.image_names.outputs.app }}
        tags: |
          type=raw,value=${{ github.event.release.tag_name }}
          type=raw,value=latest,enable=${{ !github.event.release.prerelease && !contains(github.event.release.tag_name, '-') }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}

    - name: Build and push app image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile.ghcr
        pull: true
        build-args: |
          CAPTCHA_ENABLED=true
        push: true
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha,scope=release-app-image
        cache-to: type=gha,mode=max,scope=release-app-image
        tags: ${{ steps.meta_app.outputs.tags }}
        labels: ${{ steps.meta_app.outputs.labels }}

    - name: Docker metadata (stats)
      id: meta_stats
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.image_names.outputs.stats }}
        tags: |
          type=raw,value=${{ github.event.release.tag_name }}
          type=raw,value=latest,enable=${{ !github.event.release.prerelease && !contains(github.event.release.tag_name, '-') }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}

    - name: Build and push stats image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile.stats
        push: true
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha,scope=release-stats-image
        cache-to: type=gha,mode=max,scope=release-stats-image
        tags: ${{ steps.meta_stats.outputs.tags }}
        labels: ${{ steps.meta_stats.outputs.labels }}
