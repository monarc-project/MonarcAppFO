name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    # Match the MariaDB version used by the development stacks. Runner-provided
    # MySQL can change independently and reject historical migration constraints.
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3800:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_DIR: ${{ github.workspace }}
      MYSQL_HOST: 127.0.0.1
      MYSQL_HOST_PORT: 3800
      MYSQL_DATABASE: monarc_common
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: sqlmonarcuser
      MYSQL_PASSWORD: password

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      env:
        update: "true"
      with:
        php-version: '8.4'
        extensions: imagick, intl, xml, mysql, bcmath #optional, setup extensions
        ini-values: post_max_size=256M, short_open_tag=On #optional, setup php.ini configuration
        coverage: xdebug #optional, setup coverage driver
        tools: pecl

    - name: Validate composer.json and composer.lock
      run: composer validate

    - name: Install PHP dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Create symlinks for MONARC PHP modules
      run: |
        mkdir -p module/Monarc
        cd module/Monarc
        ln -s ./../../vendor/monarc/core Core
        ln -s ./../../vendor/monarc/frontoffice FrontOffice
        cd ../..

    - name: Set MONARC configuration file
      run: |
        php <<'PHP'
        <?php
        $config = require 'config/autoload/local.php.dist';
        foreach (['orm_default', 'orm_cli'] as $connection) {
            $config['doctrine']['connection'][$connection]['params'] = array_replace(
                $config['doctrine']['connection'][$connection]['params'],
                [
                    'host' => getenv('MYSQL_HOST'),
                    'port' => (int) getenv('MYSQL_HOST_PORT'),
                    'user' => getenv('MYSQL_USER'),
                    'password' => getenv('MYSQL_PASSWORD'),
                ]
            );
        }
        $config['publicHost'] = 'http://localhost';
        file_put_contents('config/autoload/local.php', "<?php\nreturn " . var_export($config, true) . ";\n");
        PHP

    - name: Creating and populating databases
      run: |
        mysql_args=(--protocol=TCP --host="$MYSQL_HOST" --port="$MYSQL_HOST_PORT")
        MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql "${mysql_args[@]}" --user=root <<SQL
        SELECT VERSION();
        CREATE DATABASE monarc_common DEFAULT CHARACTER SET utf8 DEFAULT COLLATE utf8_general_ci;
        CREATE DATABASE monarc_cli DEFAULT CHARACTER SET utf8 DEFAULT COLLATE utf8_general_ci;
        CREATE USER '$MYSQL_USER'@'%' IDENTIFIED BY '$MYSQL_PASSWORD';
        GRANT ALL PRIVILEGES ON monarc_common.* TO '$MYSQL_USER'@'%';
        GRANT ALL PRIVILEGES ON monarc_cli.* TO '$MYSQL_USER'@'%';
        SQL
        export MYSQL_PWD="$MYSQL_PASSWORD"
        mysql "${mysql_args[@]}" --user="$MYSQL_USER" "$MYSQL_DATABASE" < db-bootstrap/monarc_structure.sql
        mysql "${mysql_args[@]}" --user="$MYSQL_USER" "$MYSQL_DATABASE" < db-bootstrap/monarc_data.sql

    - name: Upgrading databases
      run: |
        ./vendor/robmorgan/phinx/bin/phinx migrate -c ./module/Monarc/Core/migrations/phinx.php
        ./vendor/robmorgan/phinx/bin/phinx migrate -c ./module/Monarc/FrontOffice/migrations/phinx.php

    - name: Creating initial user
      run: ./vendor/robmorgan/phinx/bin/phinx seed:run -c ./module/Monarc/FrontOffice/migrations/phinx.php

    # Add a test script to composer.json, for instance: "test": "vendor/bin/phpunit"
    # Docs: https://getcomposer.org/doc/articles/scripts.md

    # - name: Run test suite
    #   run: composer run-script test
