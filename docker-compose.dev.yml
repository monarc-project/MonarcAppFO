services:
  # MariaDB database for MONARC
  fodb:
    image: mariadb:10.11
    container_name: monarc-fo-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DBPASSWORD_ADMIN}
      # The official MariaDB image only auto-creates the initial DB from MYSQL_DATABASE.
      MYSQL_DATABASE: ${DBNAME_COMMON}
      MYSQL_USER: ${DBUSER_MONARC}
      MYSQL_PASSWORD: ${DBPASSWORD_MONARC}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --bind-address=0.0.0.0
      - --default-time-zone=+00:00
      - --sql-mode=ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    ports:
      - "${DBPORT_HOST:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    networks:
      - monarc-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DBPASSWORD_ADMIN}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL database for stats service
  postgres:
    image: postgres:15
    container_name: monarc-fo-postgres
    environment:
      POSTGRES_USER: ${STATS_DB_USER}
      POSTGRES_PASSWORD: ${STATS_DB_PASSWORD}
      POSTGRES_DB: ${STATS_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - monarc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STATS_DB_USER} -d ${STATS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Stats service
  stats-service:
    build:
      context: .
      dockerfile: Dockerfile.stats
    container_name: monarc-fo-stats
    environment:
      STATS_HOST: ${STATS_HOST}
      STATS_PORT: ${STATS_PORT}
      STATS_DB_HOST: postgres
      STATS_DB_NAME: ${STATS_DB_NAME}
      STATS_DB_USER: ${STATS_DB_USER}
      STATS_DB_PASSWORD: ${STATS_DB_PASSWORD}
      STATS_SECRET_KEY: ${STATS_SECRET_KEY}
    ports:
      - "5005:5005"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - monarc-network
    volumes:
      - stats_data:/var/www/stats-service

  # MailCatcher for email testing
  mailcatcher:
    image: sj26/mailcatcher:latest
    container_name: monarc-fo-mailcatcher
    ports:
      - "1080:1080"  # Web interface
      - "8825:1025"  #  SMTP
    networks:
      - monarc-network

  # Main MONARC FrontOffice application
  monarcfoapp:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        NODE_MAJOR: ${NODE_MAJOR:-16}
        XDEBUG_ENABLED: ${XDEBUG_ENABLED:-1}
        XDEBUG_MODE: ${XDEBUG_MODE:-debug}
        XDEBUG_START_WITH_REQUEST: ${XDEBUG_START_WITH_REQUEST:-trigger}
        XDEBUG_CLIENT_HOST: ${XDEBUG_CLIENT_HOST:-host.docker.internal}
        XDEBUG_CLIENT_PORT: ${XDEBUG_CLIENT_PORT:-9003}
        XDEBUG_IDEKEY: ${XDEBUG_IDEKEY:-IDEKEY}
        XDEBUG_DISCOVER_CLIENT_HOST: ${XDEBUG_DISCOVER_CLIENT_HOST:-0}
    container_name: monarc-fo-app
    environment:
      TZ: UTC
      DBHOST: ${DBHOST:-fodb}
      DBNAME_COMMON: ${DBNAME_COMMON}
      DBNAME_CLI: ${DBNAME_CLI}
      DBUSER_MONARC: ${DBUSER_MONARC}
      DBPASSWORD_MONARC: ${DBPASSWORD_MONARC}
      DBPASSWORD_ADMIN: ${DBPASSWORD_ADMIN}
      USE_BO_COMMON: ${USE_BO_COMMON:-0}
      STATS_API_KEY: ${STATS_API_KEY}
      STATS_API_BASE_URL: ${STATS_API_BASE_URL:-http://stats-service:5005}
      PDF_CONVERTER_BINARY: ${PDF_CONVERTER_BINARY:-/usr/bin/soffice}
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-false}
      SCENARIO_ENABLED: ${SCENARIO_ENABLED:-false}
      SCENARIO_REVIEW_SCHEDULER_ENABLED: ${SCENARIO_REVIEW_SCHEDULER_ENABLED:-true}
      SCENARIO_REVIEW_SCHEDULER_CRON: "${SCENARIO_REVIEW_SCHEDULER_CRON:-15 2 * * *}"
      APP_ENV: development
      APP_DIR: /var/www/html/monarc
      # Keep generated Doctrine proxies off the macOS bind mount. Doctrine's
      # atomic proxy replacement then stays atomic under concurrent requests.
      DOCTRINE_PROXY_DIR: /var/cache/monarc/doctrine-proxies
    ports:
      - "5001:80"
    depends_on:
      fodb:
        condition: service_healthy
      # stats-service:
      #   condition: service_started
    networks:
      - monarc-network
    volumes:
      # Mount the application code for live development
      - ./:/var/www/html/monarc
      # Mount sibling repositories so Composer path symlinks and node_modules links resolve in-container
      - type: bind
        source: ../zm-core
        target: /var/www/html/zm-core
        bind:
          create_host_path: false
      - type: bind
        source: ../zm-client
        target: /var/www/html/zm-client
        bind:
          create_host_path: false
      - type: bind
        source: ../ng-anr
        target: /var/www/html/ng-anr
        bind:
          create_host_path: false
      - type: bind
        source: ../ng-client
        target: /var/www/html/ng-client
        bind:
          create_host_path: false
      # Preserve vendor directory in named volume for better performance
      - vendor_data:/var/www/html/monarc/vendor
      - node_modules_data:/var/www/html/monarc/node_modules
    working_dir: /var/www/html/monarc
    healthcheck:
      # Keep this probe independent of the Scenario rollout flag: the BFF
      # needs a live MONARC bridge host even while Scenario remains disabled.
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://127.0.0.1/api/scenario/v1/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Same-origin Scenario BFF. It has no host port: Apache is the only entry
  # point and proxies /scenario after the server-side feature check.
  scenario-ui-fo:
    build:
      context: ../scenario-ui
      dockerfile: docker/production/Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: /scenario
    environment:
      SCENARIO_ENABLED: ${SCENARIO_ENABLED:-false}
      SCENARIO_BASE_PATH: /scenario
      SCENARIO_OFFICE: frontoffice
      # This is the local Apache HTTP topology only. Production defaults to
      # secure, __Secure-prefixed cookies and rejects this profile.
      SCENARIO_DEPLOYMENT_ENV: development
      SCENARIO_COOKIE_MODE: local-http
      SCENARIO_PUBLIC_ORIGIN: ${SCENARIO_PUBLIC_ORIGIN:-http://127.0.0.1:5001}
      SCENARIO_API_ORIGIN: http://monarcfoapp
      SCENARIO_AUTH_MODE: legacy
      SCENARIO_LEGACY_BRIDGE_EXCHANGE_URL: http://monarcfoapp/api/scenario/v1/auth/bridge/consume
      SCENARIO_LEGACY_BRIDGE_SERVICE_TOKEN: ${SCENARIO_LEGACY_BRIDGE_SERVICE_TOKEN:-}
    depends_on:
      monarcfoapp:
        condition: service_healthy
    networks:
      - monarc-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/scenario/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  monarc-network:
    name: ${MONARC_NETWORK_NAME:-monarc-network}
    external: true

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      device: ./docker/db_data
      o: bind
  postgres_data:
  stats_data:
  vendor_data:
    driver: local
    driver_opts:
      type: none
      device: ./vendor
      o: bind
  node_modules_data:
    driver: local
    driver_opts:
      type: none
      device: ./node_modules
      o: bind
