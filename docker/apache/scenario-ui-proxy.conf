# The BFF is reachable only through this same-origin path. Docker Compose puts
# `scenario-ui` on the private MONARC network; do not publish its port.
ProxyRequests Off
ProxyPreserveHost On
ProxyAddHeaders On

RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
RequestHeader set X-Forwarded-Host expr=%{HTTP_HOST}
RequestHeader set X-Request-Id expr=%{req:X-Request-Id}

ProxyPass /scenario/ http://scenario-ui-fo:3000/scenario/ connectiontimeout=5 timeout=60
ProxyPassReverse /scenario/ http://scenario-ui-fo:3000/scenario/
ProxyPass /scenario http://scenario-ui-fo:3000/scenario connectiontimeout=5 timeout=60
ProxyPassReverse /scenario http://scenario-ui-fo:3000/scenario
